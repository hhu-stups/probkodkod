plugins {
	id 'java'
	id 'eclipse'
	id 'application'
	id 'maven-publish'
	id 'signing'
}

project.version = '1.0.7-SNAPSHOT'
project.group = 'de.hhu.stups'

repositories {
	mavenCentral()
}

configurations {
	sablecc
	kodkod
}

def generatedParserDir = layout.buildDirectory.dir('temp')

dependencies {
	sablecc 'de.hhu.stups:sablecc:3.2.10'
	implementation 'de.hhu.stups:prologlib:2.4.40'
	kodkod files('libs/kodkod.jar')
	implementation 'org.ow2.sat4j:org.ow2.sat4j.core:2.3.6'
	testImplementation files('libs/kodkod.jar')
	testImplementation 'junit:junit:4.8.2'
}

java {
	withJavadocJar()
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	// ProB still supports Java 8
	options.release = 8
	options.encoding = 'UTF-8'
}

def genParser = tasks.register('genParser', JavaExec) {
	inputs.dir 'src/main/resources'
	outputs.dir generatedParserDir
	mainClass = 'org.sablecc.sablecc.SableCC'
	classpath = configurations.sablecc
	maxHeapSize = '1024m'
	args = ['-d', generatedParserDir.get().asFile.path, 'src/main/resources/problem.grammar']
	doFirst {
		generatedParserDir.get().asFile.mkdirs()
	}
}

sourceSets {
	main {
		java {
			srcDir files(generatedParserDir).builtBy(genParser)
		}
		compileClasspath += configurations.kodkod
	}
}

// the lexer and parser tables generated by SableCC
processResources {
	from(files(generatedParserDir).builtBy(genParser)) {
		include '**/*.dat'
	}
}

application {
	mainClass = 'de.stups.probkodkod.KodkodInteraction'
}

javadoc {
	failOnError = false
}

jar {
	manifest {
		attributes([
			'Main-Class': application.mainClass.get(),
			'Implementation-Title': 'ProB Kodkod',
			'Implementation-Version': project.version,
		])
	}
	include '**/*.class'
	include '**/*.java'
	exclude '**.*.scc'
	include '**/*.dat'
	include '**/*.properties'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	from { configurations.kodkod.collect { it.isDirectory() ? it : zipTree(it) } }
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			pom {
				name = 'ProB Kodkod'
				description = 'Wrapper to use Kodkod in ProB.'
				url = 'https://gitlab.cs.uni-duesseldorf.de/general/stups/probkodkod'
				licenses {
					license {
						name = 'MIT License'
						url = 'https://github.com/emina/kodkod/blob/v2.1/LICENSE'
					}
				}
				scm {
					connection = 'scm:git:https://gitlab.cs.uni-duesseldorf.de/general/stups/probkodkod.git'
					developerConnection = 'scm:git:git@gitlab.cs.uni-duesseldorf.de:general/stups/probkodkod.git'
					url = 'https://gitlab.cs.uni-duesseldorf.de/general/stups/probkodkod'
				}
				developers {
					developer {
						id = 'bendisposto'
						name = 'Jens Bendisposto'
						email = 'jens@bendisposto.de'
					}
				}
			}
		}
	}

	if (project.hasProperty('ossrhUsername') && project.hasProperty('ossrhPassword')) {
		repositories {
			maven {
				def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
				def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
				url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
				credentials {
					username = ossrhUsername
					password = ossrhPassword
				}
			}
		}
	}
}

if (project.hasProperty('ossrhUsername') && project.hasProperty('ossrhPassword')) {
	ext.'signing.secretKeyRingFile' = rootProject.file('secring.gpg').absolutePath

	signing {
		sign publishing.publications.mavenJava
	}
}
